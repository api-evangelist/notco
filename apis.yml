aid: notco
name: Notco
description: >-
  NotCo (The Not Company) is a food-technology company founded in 2015 in
  Santiago, Chile that uses artificial intelligence — its proprietary "Giuseppe"
  platform — to reverse-engineer animal-based foods from plant ingredients. Its
  consumer brand at notco.com sells plant-based products including NotMilk,
  NotMayo, NotBurger and NotIceCream across the Americas, while NotCo AI
  (notco.ai) licenses the Giuseppe AI R&D platform to global CPG manufacturers
  such as PepsiCo, Magnum and Barry Callebaut to accelerate food-product
  innovation. The company is backed by General Catalyst and other investors.
  NotCo publishes no public developer API; this profile captures its corporate,
  product, AI-platform and trust/compliance web surface for the API Evangelist
  network.
